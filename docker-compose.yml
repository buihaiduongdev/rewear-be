services:
  postgres:
    image: postgres:16-alpine
    container_name: rewear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rewear
    ports:
      - "5432:5432"
    volumes:
      - rewear-pgdata:/var/lib/postgresql/data

volumes:
  rewear-pgdata:
