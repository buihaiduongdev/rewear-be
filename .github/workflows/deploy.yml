name: Build and Deploy to EC2
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to deploy (mặc định: latest)'
        required: false
        default: 'latest'

permissions:
  contents: read
  id-token: write

env:
  IMAGE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (for ARM64 build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push .

      - name: Deploy app to EC2 via AWS SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          DEPLOY_APP_ID=$(aws ssm send-command \
            --region "${{ secrets.AWS_REGION }}" \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin '${ECR_REGISTRY}'",
              "IMAGE_TAG='${IMAGE_TAG}' docker compose -f /home/ubuntu/docker-compose.prod.yml pull backend",
              "IMAGE_TAG='${IMAGE_TAG}' docker compose -f /home/ubuntu/docker-compose.prod.yml up -d --no-deps backend"
            ]' --query "Command.CommandId" --output text)

          if ! aws ssm wait command-executed \
            --region "${{ secrets.AWS_REGION }}" \
            --command-id "$DEPLOY_APP_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"; then

            aws ssm get-command-invocation \
              --region "${{ secrets.AWS_REGION }}" \
              --command-id "$DEPLOY_APP_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi

          echo "Deployment completed successfully!"
